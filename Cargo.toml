[package]
name = "trayproxy"
version = "0.1.0"
edition = "2024"
description = "Proxy StatusNotifierItems as XEmbed system tray icons"

[dependencies]
async-channel = "2"
freedesktop-icons = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
glib = "0.18"
gtk = "0.18"
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = "0.45"
serde = { version = "1", features = ["derive"] }
toml = "1"
x11rb = { version = "0.13", features = ["render", "allow-unsafe-code"] }
zbus = { version = "5", default-features = false, features = ["async-io"] }

[profile.release]
lto = true
strip = true
